name: Generate Snake Animation

on:
  # প্রতি ১২ ঘণ্টায় অটোমেটিক রান হবে
  schedule:
    - cron: "0 */12 * * *"
  
  # ম্যানুয়ালি রান করার জন্য
  workflow_dispatch:
  
  # main ব্রাঞ্চে পুশ হলে রান হবে
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # GitHub Contribution Grid থেকে স্নেক অ্যানিমেশন তৈরি
      - name: generate-github-user-contribution-grid-snake-animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # তৈরি হওয়া ফাইলটি output/github-contribution-grid-snake.svg ব্রাঞ্চে পুশ করা
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
